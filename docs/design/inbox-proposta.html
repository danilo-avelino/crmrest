<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox · Proposta — Dish Desk</title>
<!--
  PROPOSTA de melhoria da Inbox (protótipo navegável, dados fictícios). Nada aqui está em produção.
  Segue os tokens de apps/web/app/globals.css e o board "Inbox" do Dish Desk Design.html.
  A lista do que mudou está no botão "O que mudou", na barra do topo.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f4ef;--surface:#fff;--surface-2:#f0ede8;--ink:#1a1814;--ink-2:#4a4540;--ink-3:#8c857d;
  --rule:#ddd8d0;--rule-soft:#e8e4de;--tomate:#c4341a;--tomate-text:#c4341a;--tomate-lt:#fdecea;--tomate-line:#f5b5ac;--tomate-ink:#9b2414;
  --warning:#b45309;--warning-lt:#fef9ec;--warning-line:#f0d88a;--warning-ink:#7a5008;
  --success:#2d7d46;--success-lt:#eaf6ef;--success-line:#a8d9bb;--success-ink:#1d5c33;--tag-line:#c4b8a0;
  --whatsapp:#25d366;--instagram:#e1306c;--ifood:#ea1d2c;--cardapio:#7c3aed;
  --rail:#1a1814;--shadow:0 6px 20px rgb(26 24 20 / .14);--proto:#2f7df6;
}
.dark{
  color-scheme:dark;
  --paper:#1a1814;--surface:#24211c;--surface-2:#2e2a25;--ink:#f2ede6;--ink-2:#cfc6bb;--ink-3:#a2968a;
  --rule:#3a352f;--rule-soft:#2e2a25;--tomate-text:#f07a62;--tomate-lt:#3a1f18;--tomate-line:#6b2a1d;--tomate-ink:#f3a08f;
  --warning:#e59a4a;--warning-lt:#33290f;--warning-line:#6b5420;--warning-ink:#f0c96b;
  --success:#4fa36c;--success-lt:#17301f;--success-line:#2f5a3e;--success-ink:#8fd3a6;--tag-line:#5a5248;
  --rail:#131110;--shadow:0 6px 24px rgb(0 0 0 / .5);
}
*{box-sizing:border-box;margin:0;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden;font:400 13px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
.num{font-variant-numeric:tabular-nums}
.heading{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.3px}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tomate{color:var(--tomate-text)}
.dark .paper-bg{background-image:radial-gradient(rgb(247 244 239 / .07) 1px,transparent 1.2px);background-size:22px 22px;background-attachment:fixed}
@keyframes pulse{50%{opacity:.5}}
@keyframes bounce{0%,100%{transform:translateY(-18%)}50%{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Barra da proposta (fora do sistema) ── */
.pbar{height:36px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 12px;background:#0f0e0c;color:#bdb4a8;font-size:12px;border-bottom:1px dashed #5c5750;white-space:nowrap}
.pbar-tag{font-size:10px;font-weight:700;letter-spacing:.08em;color:#fff;background:var(--proto);border-radius:3px;padding:1px 6px}
.pbar strong{color:#f7f4ef;font-weight:600}
.pbar-info{overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.pbar-btn{height:24px;padding:0 10px;border-radius:5px;border:1px solid #5c5750;color:#f2ede6;font-size:11.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.pbar-btn:hover,.pbar-btn[aria-pressed=true]{background:#2d2a24}
.pbar-btn b{background:var(--proto);color:#fff;border-radius:8px;padding:0 5px;font-size:10px;line-height:15px}
.seg{display:inline-flex;border:1px solid #5c5750;border-radius:5px;overflow:hidden}
.seg button{height:22px;padding:0 9px;font-size:11.5px;color:#a2968a}
.seg button[aria-pressed=true]{background:#f2ede6;color:#1a1814;font-weight:500}

/* ── Botões e selos do Sistema de Design ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:6px;border:1px solid transparent;font-size:13px;font-weight:500;white-space:nowrap;flex-shrink:0}
.btn.sm{height:30px;padding:0 12px;border-radius:5px;font-size:12px;gap:5px}
.btn.xs{height:26px;padding:0 9px;border-radius:4px;font-size:11px;gap:4px}
.btn.icon{padding:0;width:30px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{opacity:.85}
.btn.accent{background:var(--tomate);color:#fff}
.btn.accent:hover{opacity:.9}
.btn.outline{border-color:var(--rule);background:var(--surface);color:var(--ink)}
.btn.outline:hover,.btn.outline[aria-expanded=true]{background:var(--surface-2)}
.btn.ghost{color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn:disabled{opacity:.55}
.badge{display:inline-flex;align-items:center;gap:3px;border:1px solid;border-radius:3px;padding:1px 6px;font-size:10px;font-weight:500;white-space:nowrap;flex-shrink:0}
.badge.pending{border-color:var(--warning-line);background:var(--warning-lt);color:var(--warning-ink)}
.badge.resolved{border-color:var(--success-line);background:var(--success-lt);color:var(--success-ink)}
.badge.open{border-color:var(--tomate-line);background:var(--tomate-lt);color:var(--tomate-ink)}
.badge.neutral{border-color:var(--rule);background:var(--surface-2);color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--tomate);color:#fff;font-size:10px;font-weight:700;line-height:1}
.pill.soft{background:var(--surface-2);color:var(--ink-2);font-weight:600}
.fraud{display:inline-flex;align-items:center;gap:4px;border-radius:4px;background:var(--tomate);color:#fff;padding:0 7px;font-size:11px;line-height:17px;font-weight:600;white-space:nowrap}
.teamonly{border-radius:4px;border:1px solid var(--rule);background:var(--surface-2);color:var(--ink-2);padding:0 7px;font-size:10.5px;line-height:17px;font-weight:500;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:600;flex-shrink:0}
.menu-wrap{position:relative;display:inline-flex}
.menu{position:absolute;top:calc(100% + 4px);right:0;z-index:30;min-width:216px;padding:4px;border-radius:8px;background:var(--surface);box-shadow:var(--shadow);outline:1px solid var(--rule)}
.menu button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:5px;font-size:12.5px}
.menu button:hover{background:var(--surface-2)}
.menu button span{flex:1}
.menu hr{border:0;border-top:1px solid var(--rule);margin:4px -4px}

/* ── Estrutura ── */
.app{flex:1;min-height:0;display:flex;background:var(--paper);position:relative}
.rail{width:56px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 0;background:var(--rail);border-right:1px solid #2d2a24}
.rail-logo{width:32px;height:32px;border-radius:6px;background:#c4341a;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.rail-item{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#5c5750;margin-top:4px}
.rail-item:hover,.rail-item.active{background:#2d2a24;color:#f7f4ef}
.rail-item:disabled{background:none;color:#5c5750}
.rail-sep{width:24px;height:1px;background:#2d2a24;margin-bottom:6px;flex-shrink:0}
.rail-me{width:32px;height:32px;border-radius:50%;border:1.5px solid #5c5750;background:#3d3a34;color:#ddd8d0;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:12px;flex-shrink:0}

/* ── Lista de conversas ── */
.list{width:320px;flex-shrink:0;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--rule)}
.list-head{height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 0 16px;border-bottom:1px solid var(--rule)}
.list-head h2{font-size:16px}
.tenant-btn{height:28px;max-width:196px;padding:0 7px 0 9px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);font-size:11.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.tenant-btn.on{border-color:var(--ink);color:var(--ink);font-weight:500}
.tenant-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alarm{flex-shrink:0;display:flex;align-items:center;gap:8px;width:100%;padding:8px 16px;font-size:12px;font-weight:600}
.alarm.urgent{background:var(--tomate);color:#fff}
.alarm.urgent .ic{animation:bounce 1s infinite}
.alarm.quiet{background:var(--ink);color:var(--paper)}
.alarm span{flex:1}
.alarm em{font-style:normal;font-weight:500;opacity:.9;text-decoration:underline;text-underline-offset:2px}
.search{flex-shrink:0;padding:10px 12px 6px}
.search label{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);color:var(--ink-3)}
.search label:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgb(26 24 20 / .08)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:12px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.tabs{flex-shrink:0;display:flex;gap:20px;padding:0 14px;border-bottom:1px solid var(--rule)}
.tab{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 0 9px;font-size:12.5px;color:var(--ink-3)}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected=true]{color:var(--ink);font-weight:500}
.tab[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.subs{flex-shrink:0;display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--rule-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--rule);border-radius:4px;font-size:11px;color:var(--ink-2)}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:500}
.chip .n{opacity:.7}
.rows{flex:1;overflow-y:auto}
.row{display:flex;gap:10px;width:100%;padding:11px 14px 11px 12px;border-bottom:1px solid var(--rule-soft);border-left:2px solid transparent;background:var(--surface)}
.row:hover{background:var(--paper)}
.row.active{background:var(--tomate-lt);border-left-color:var(--tomate);border-bottom-color:var(--tomate-line)}
.row.calling{border-left:4px solid var(--tomate);padding-left:10px;background:var(--tomate-lt)}
.row.calling.quiet{border-left-color:var(--ink);background:var(--surface)}
.row.calling.quiet.active{background:var(--tomate-lt)}
.logo{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0}
.row-main{flex:1;min-width:0}
.row-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.row-name{display:flex;align-items:center;gap:6px;min-width:0}
.row-name b{font-size:13px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.unread .row-name b,.row.active .row-name b{font-weight:600}
.row-time{display:inline-flex;align-items:center;gap:4px;flex-shrink:0;font-size:11px;color:var(--ink-3)}
.row.unread .row-time{color:var(--tomate-text);font-weight:600}
.row-time.waiting{color:var(--warning);font-weight:600}
.row-meta{margin-top:1px;font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-prev{display:flex;align-items:center;gap:4px;margin-top:1px;font-size:12px;color:var(--ink-3)}
.row-prev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.unread .row-prev{color:var(--ink);font-weight:500}
.row.active .row-prev{color:var(--ink-2)}
.row-flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.call-badge{display:inline-flex;align-items:center;gap:4px;margin-bottom:4px;padding:2px 6px;border-radius:4px;background:var(--tomate);color:#fff;font-size:10px;font-weight:600;animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
.call-badge.quiet{background:var(--ink);color:var(--paper);animation:none}
.empty{padding:28px 24px;text-align:center;font-size:12px;color:var(--ink-3)}

/* ── Conversa ── */
.center{flex:1;min-width:0;display:flex;flex-direction:column}
.conv{flex:1;min-height:0;display:flex;flex-direction:column;background-color:var(--paper);border-right:1px solid var(--rule)}
.conv-head{height:52px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--rule)}
.conv-id{flex:1;min-width:0}
.conv-name{display:flex;align-items:center;gap:8px}
.conv-name b{font-family:Fraunces,Georgia,serif;font-size:15px;font-weight:700;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-sub{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.conv-sub strong{font-weight:500;color:var(--ink-2)}
.conv-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.assign{max-width:170px;color:var(--ink-2)}
.assign.has{color:var(--ink)}
.assign span{overflow:hidden;text-overflow:ellipsis}
.team-note{flex-shrink:0;margin:12px 16px 0;display:flex;gap:8px;align-items:flex-start;border:1px dashed var(--tag-line);border-radius:5px;background:var(--warning-lt);color:var(--warning-ink);padding:10px 12px;font-size:12.5px}
.team-note .ic{margin-top:2px}
.fraud-bar{flex-shrink:0;margin:12px 16px 0;display:flex;align-items:center;gap:8px;border:1px solid var(--tomate);border-radius:6px;background:var(--surface);padding:8px 12px;font-size:12px;color:var(--ink-2)}
.fraud-bar strong{color:var(--ink);font-weight:600}
.fraud-bar .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.tl-wrap{position:relative;flex:1;min-height:0;display:flex}
.timeline{flex:1;overflow-y:auto;padding:20px 20px 12px}
.tl-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.day{display:flex;align-items:center;gap:12px;margin:4px 0;font-size:11px;font-weight:500;color:var(--ink-3)}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--rule)}
.sys{align-self:center;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:11px;background:var(--surface-2);color:var(--ink-3);text-align:center}
.sys.success{border:1px solid var(--success-line);background:var(--success-lt);color:var(--success-ink)}
.sys.warning{border:1px solid var(--warning-line);background:var(--warning-lt);color:var(--warning-ink)}
.sys.hot{border:1px solid var(--tomate-line);background:var(--tomate-lt);color:var(--tomate-ink)}
.auto{align-self:center;max-width:76%;margin:4px 0;border:1px solid var(--warning-line);border-radius:10px;background:var(--warning-lt);padding:10px 14px}
.auto .lbl{display:flex;align-items:center;gap:5px;margin-bottom:4px;font-size:10.5px;font-weight:600;color:var(--warning-ink)}
.note{align-self:center;max-width:72%;margin:4px 0;border:1px dashed var(--warning-line);border-radius:12px;background:var(--warning-lt);padding:8px 12px}
.note .lbl{display:flex;align-items:center;gap:4px;margin-bottom:3px;font-size:10.5px;font-weight:500;color:var(--warning-ink)}
.note .txt{font-size:12.5px;color:var(--ink-2)}
.txt{line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{margin-top:3px;text-align:right;font-size:10px;color:var(--ink-3)}
.meta .ic{vertical-align:-1px}
.msg{display:flex}
.msg.in{align-items:flex-end;gap:7px;max-width:78%}
.msg.in .bubble{border:1px solid var(--rule);border-radius:12px 12px 12px 2px;background:var(--surface);padding:8px 12px}
.msg.out{align-self:flex-end;max-width:74%}
.msg.out .bubble{border-radius:12px 12px 2px 12px;background:var(--ink);color:var(--paper);padding:8px 12px}
.msg.cont{margin-top:-7px}
.msg.stack .bubble{border-radius:12px}
.av-gap{width:22px;flex-shrink:0}
.ocard{margin-left:29px;max-width:360px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);overflow:hidden}
.ocard-head,.ocard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;background-color:var(--paper);padding:10px 14px}
.ocard-head{border-bottom:1px solid var(--rule);font-size:11.5px;font-weight:600}
.ocard-head span:first-child{display:inline-flex;align-items:center;gap:6px}
.ocard-st{border:1px solid var(--warning-line);border-radius:4px;background:var(--warning-lt);padding:2px 7px;font-size:10.5px;font-weight:500}
.ocard-body{display:flex;flex-direction:column;gap:5px;padding:10px 14px;font-size:12.5px}
.ocard-body div{display:flex;justify-content:space-between;gap:12px}
.ocard-body small{display:block;font-size:11px;color:var(--ink-3)}
.ocard-body .price{color:var(--ink-2)}
.ocard-body hr{border:0;border-top:1px solid var(--rule);margin:4px 0}
.ocard-body .total{font-size:13px;font-weight:600}
.ocard-foot{border-top:1px solid var(--rule);padding:7px 14px;font-size:10.5px;color:var(--ink-3)}
.newmsg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:500;box-shadow:var(--shadow)}

.msg .bubble{position:relative}
.fwd{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;display:none;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--rule);color:var(--ink-2);box-shadow:0 2px 6px rgb(26 24 20 / .12)}
.fwd:hover{color:var(--ink);background:var(--surface-2)}
.msg.in .fwd{right:-36px}
.msg.out .fwd{left:-36px}
.msg:hover .fwd,.fwd:focus-visible{display:flex}
.fwd-label{display:flex;align-items:center;gap:4px;margin-bottom:3px;font-size:10.5px;font-style:italic;opacity:.75}
.photo{width:220px;height:132px;border-radius:8px;margin:2px 0 6px;background:linear-gradient(135deg,#d9c3a0,#8c6a3a);display:flex;align-items:flex-end;gap:5px;padding:8px;color:#fff;font-size:11px}
.loc{display:inline-flex;align-items:flex-start;gap:6px;font-weight:500;text-align:left}
.loc .ic{margin-top:2px}
.loc:hover span{text-decoration:underline;text-underline-offset:2px}
.loc small{display:block;font-weight:400;font-size:11px;opacity:.7}
.ocard-cust{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--rule);padding:8px 14px;font-size:11.5px}
.ocard-cust span{min-width:0;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .wa{margin-left:auto}
.toast-btn{margin-left:10px;color:#9db8ff;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.overlay{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgb(26 24 20 / .45)}
.dialog{position:relative;width:440px;max-height:calc(100vh - 80px);display:flex;flex-direction:column;border-radius:8px;background:var(--surface);box-shadow:var(--shadow);outline:1px solid var(--rule)}
.dialog header{display:flex;align-items:flex-start;gap:8px;padding:18px 20px 14px;border-bottom:1px solid var(--rule)}
.dialog header h2{font-size:16px}
.dialog header p{margin-top:2px;font-size:12px;color:var(--ink-3)}
.dialog header .x{margin-left:auto;width:26px}
.fwd-preview{display:flex;align-items:flex-start;gap:8px;margin:14px 20px 0;border-radius:6px;background:var(--paper);padding:10px 12px;font-size:12.5px;color:var(--ink-2)}
.fwd-preview .ic{margin-top:2px;color:var(--ink-3)}
.dialog .search{padding:12px 20px 6px}
.fwd-list{flex:1;min-height:120px;overflow-y:auto;padding:0 12px 8px}
.fwd-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:6px}
.fwd-row:hover{background:var(--surface-2)}
.fwd-row[aria-pressed=true]{background:var(--tomate-lt);outline:1px solid var(--tomate-line)}
.fwd-row:disabled{opacity:.55;background:none}
.fwd-row .logo{width:30px;height:30px}
.fwd-row b{display:block;font-size:12.5px;font-weight:500}
.fwd-row small{display:block;font-size:11px;color:var(--ink-3)}
.fwd-row .check{margin-left:auto;color:var(--tomate-text)}
.dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--rule)}

/* ── Campo de resposta ── */
.composer{flex-shrink:0;border-top:1px solid var(--rule);background:var(--surface)}
.ctabs{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--rule)}
.ctab{margin-bottom:-1px;padding:8px 14px;border-bottom:2px solid transparent;font-size:12px;color:var(--ink-3)}
.ctab:hover{color:var(--ink-2)}
.ctab[aria-selected=true]{border-color:var(--ink);color:var(--ink);font-weight:500}
.ctab:disabled{opacity:.55}
.ctabs-hint{margin-left:auto;font-size:11px;color:var(--ink-3)}
.cbody{position:relative;display:flex;flex-direction:column;gap:8px;padding:10px 14px 8px}
.cbody textarea{display:block;width:100%;min-height:64px;max-height:180px;resize:none;border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:10px 12px;font:inherit;color:var(--ink);outline:0}
.cbody textarea::placeholder{color:var(--ink-3)}
.cbody textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgb(26 24 20 / .08)}
.dark .cbody textarea:focus{box-shadow:0 0 0 3px rgb(242 237 230 / .1)}
.cbody textarea.note{border-color:var(--warning-line);background:var(--warning-lt)}
.cbody textarea.ai{border-color:var(--tomate-line);box-shadow:0 0 0 3px rgb(196 52 26 / .08)}
.cbody textarea:disabled{background:var(--surface-2)}
.blocked{min-height:64px;border:1px solid var(--rule);border-radius:6px;background:var(--surface-2);padding:10px 12px;font-size:12.5px;color:var(--ink-3)}
.ai-line{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-2)}
.ai-line b{font-weight:600;color:var(--tomate-text)}
.ai-line .btn{margin-left:auto}
.cfoot{display:flex;align-items:center;gap:8px}
.cfoot-l{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.win{display:inline-flex;align-items:center;gap:4px;margin-left:4px;font-size:11px;color:var(--ink-3);white-space:nowrap}
.khint{font-size:11px;color:var(--ink-3);white-space:nowrap}
.composer{container-type:inline-size}
@container (max-width:600px){.khint{display:none}}
.khint kbd{font:inherit;font-size:10px;border:1px solid var(--rule);border-radius:3px;padding:0 4px;background:var(--surface-2);color:var(--ink-2)}
.send{height:32px;padding:0 14px;border-radius:5px;font-size:12.5px}
.qr{position:absolute;left:14px;right:14px;bottom:100%;z-index:20;max-height:232px;overflow-y:auto;margin:0 0 4px;padding:4px;list-style:none;border-radius:8px;background:var(--surface);box-shadow:var(--shadow);outline:1px solid var(--rule)}
.qr-title{padding:4px 8px 6px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.qr button{display:flex;flex-direction:column;width:100%;padding:6px 8px;border-radius:5px}
.qr button.hl,.qr button:hover{background:var(--surface-2)}
.qr b{font-size:12px;font-weight:500}
.qr span{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Painel da direita ── */
.side{width:344px;flex-shrink:0;display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.side-tabs{height:52px;flex-shrink:0;display:flex;align-items:stretch;gap:22px;padding:0 16px;border-bottom:1px solid var(--rule)}
.side-tab{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}
.side-tab:hover{color:var(--ink-2)}
.side-tab[aria-selected=true]{color:var(--ink);font-weight:500}
.side-tab[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.late-tag{font-size:11px;font-weight:600;color:var(--tomate-text)}
.side-body{flex:1;overflow-y:auto}
.cp-head{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--rule)}
.cp-head h3{font-size:16px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-head h3 button:hover{text-decoration:underline;text-underline-offset:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{border:1px dashed var(--tag-line);border-radius:4px;padding:2px 7px;font-size:10.5px;color:var(--ink-2)}
.tag.add{color:var(--ink-3)}
.sec{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.sec:last-child{border-bottom:0}
.sec-title{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sec-title span{font-size:10.5px;font-weight:500;letter-spacing:0;text-transform:none}
.irow{display:flex;align-items:flex-start;gap:8px;font-size:12.5px}
.irow>.ic{margin-top:3px;color:var(--ink-3)}
.irow small{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--success)}
.copy{margin-left:auto;width:24px;height:24px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3)}
.copy:hover{background:var(--surface-2);color:var(--ink)}
.linkish{font-size:11px;color:var(--ink-3)}
.linkish:hover{color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}
.co-line{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.co-line span:last-child{margin-left:auto;font-weight:400;color:var(--ink-2)}
.bar{position:relative;height:8px;border-radius:999px;background:var(--surface-2)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--ink)}
.bar.late i{background:var(--tomate)}
.bar u{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;transform:translateX(-50%)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:11.5px}
.kv dt{display:flex;align-items:center;gap:6px;color:var(--ink-3)}
.kv dd{text-align:right}
.kv .dot{width:8px;height:8px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metrics b{display:block;font-family:Fraunces,Georgia,serif;font-size:20px;line-height:1;font-weight:700}
.metrics span{font-size:10.5px;color:var(--ink-3)}
.recent{border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.recent div{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--rule)}
.recent div:last-child{border-bottom:0}
.recent div.live{background:var(--tomate-lt)}
.recent b{display:block;font-size:12px;font-weight:500}
.recent small{font-size:10.5px;color:var(--ink-3)}
.recent span{text-align:right}
.oh{flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px 14px;border-bottom:1px solid var(--rule)}
.oh h2{font-size:16px}
.oh p{margin-top:2px;font-size:12px;color:var(--ink-3)}
.stages{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--rule)}
.stages div{padding:10px 2px 9px;text-align:center;border-left:1px solid var(--rule-soft)}
.stages div:first-child{border-left:0}
.stages b{display:block;font-size:15px;font-weight:600;line-height:1.2}
.stages span{font-size:10px;white-space:nowrap;color:var(--ink-3)}
.stages .alert b,.stages .alert span{color:var(--tomate-text)}
.orow{display:block;width:100%;padding:10px 16px 10px 13px;border-bottom:1px solid var(--rule-soft);border-left:3px solid transparent}
.orow:hover{background:var(--paper)}
.orow.late{border-left-color:var(--tomate);background:var(--tomate-lt)}
.orow-top{display:flex;align-items:center;gap:8px}
.orow-top b{font-weight:500}
.orow-top span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.orow-top em{font-style:normal;font-size:11px;color:var(--ink-3)}
.orow.late .orow-top em{color:var(--tomate-text);font-weight:500}
.orow-bot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding-left:16px;font-size:12px;color:var(--ink-3)}
.orow-bot span:last-child{display:inline-flex;gap:4px}
.side-foot{padding:12px 16px}

/* ── Início da Inbox ── */
.home{flex:1;overflow-y:auto;background-color:var(--paper);border-right:1px solid var(--rule)}
.home-inner{max-width:720px;margin:0 auto;padding:28px 24px 40px}
.setup{display:flex;align-items:center;gap:14px;margin-bottom:28px;border:1px solid var(--tomate-line);border-radius:12px;background:var(--tomate-lt);padding:14px 16px}
.setup .ring{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:conic-gradient(var(--tomate) 200deg,var(--tomate-line) 0);position:relative}
.setup .ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--tomate-lt)}
.setup .ring span{position:relative}
.setup div{flex:1;min-width:0}
.setup b{display:block;font-weight:600}
.setup p{font-size:12px;color:var(--ink-2)}
.home h1{font-family:Fraunces,Georgia,serif;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.5px}
.home-lead{margin-top:6px;display:flex;align-items:center;gap:8px;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 30px}
.stat{display:block;border:1px solid var(--rule-soft);border-radius:12px;background:var(--surface);padding:14px 16px}
.stat:hover{border-color:var(--rule)}
.stat span{display:block;font-size:12px;font-weight:500;color:var(--ink-2)}
.stat b{display:block;margin:6px 0 4px;font-family:Fraunces,Georgia,serif;font-size:28px;line-height:1;font-weight:700}
.stat small{font-size:11.5px;color:var(--ink-3)}
.stat.alert{border-color:var(--tomate-line);background:var(--tomate-lt)}
.stat.alert b{color:var(--tomate-text)}
.hsec{margin-bottom:30px}
.hsec h2{font-size:16px}
.hsec>p{margin:2px 0 14px;color:var(--ink-3)}
.card{border:1px solid var(--rule-soft);border-radius:12px;background:var(--surface);overflow:hidden}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--rule-soft)}
.hrow:first-child{border-top:0}
.hrow-ic{width:36px;height:36px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--paper)}
.hrow-ic img{width:100%;height:100%;border-radius:9px;object-fit:cover}
.hrow-main{flex:1;min-width:0}
.hrow-name{display:flex;align-items:center;gap:8px}
.hrow-name b{font-weight:600;white-space:nowrap}
.hrow-main p{margin-top:2px;font-size:11.5px;color:var(--ink-3)}
.hrow-main p.one{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:600;white-space:nowrap}
.st i{width:5px;height:5px;border-radius:50%}
.st.ok{background:var(--success-lt);color:var(--success-ink)} .st.ok i{background:var(--success)}
.st.off{background:var(--surface-2);color:var(--ink-3)} .st.off i{background:var(--ink-3)}
.st.warn{background:var(--warning-lt);color:var(--warning-ink)} .st.warn i{background:var(--warning)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .hrow{border:1px solid var(--rule-soft);border-radius:12px;background:var(--surface)}
.addint{display:inline-flex;align-items:center;gap:6px;margin-top:10px;height:36px;padding:0 10px;border-radius:6px;font-weight:500;color:var(--tomate-text)}
.addint:hover{background:var(--tomate-lt)}

/* ── Lista "O que mudou" e destaque (fora do sistema) ── */
.changes{position:fixed;top:44px;bottom:8px;width:348px;z-index:60;display:flex;flex-direction:column;border:1px solid #4a4540;border-radius:10px;background:#16140f;color:#d9d1c6;box-shadow:0 14px 44px rgb(0 0 0 / .45)}
.changes.right{right:8px}
.changes.left{left:64px}
.changes header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #2d2a24}
.changes header b{font-family:Fraunces,Georgia,serif;font-size:15px;color:#f7f4ef;letter-spacing:-.2px}
.changes header p{font-size:11px;color:#8c857d}
.changes header button{margin-left:auto;width:26px;height:26px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#a2968a}
.changes header button:hover{background:#2d2a24;color:#f7f4ef}
.changes ol{flex:1;overflow-y:auto;list-style:none;padding:6px}
.changes li button{display:flex;gap:10px;width:100%;padding:9px 8px;border-radius:7px}
.changes li button:hover{background:#221f19}
.changes li button.on{background:#221f19;outline:1px solid var(--proto)}
.changes i{font-style:normal;width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--proto);color:#fff;font-size:10.5px;font-weight:700;margin-top:1px}
.changes li b{display:block;font-size:12.5px;font-weight:600;color:#f2ede6}
.changes li span{display:block;margin-top:2px;font-size:11.5px;line-height:1.45;color:#a2968a}
.changes li em{display:block;margin-top:4px;font-style:normal;font-size:10.5px;color:#7d8fb3}
.changes footer{padding:10px 14px;border-top:1px solid #2d2a24;font-size:11px;line-height:1.45;color:#8c857d}
@keyframes mark{0%,100%{outline-color:var(--proto)}50%{outline-color:transparent}}
.mark-on{outline:2px solid var(--proto)!important;outline-offset:-2px;animation:mark 1s ease 3}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;max-width:440px;border-radius:7px;background:#0f0e0c;color:#f2ede6;border:1px solid #4a4540;padding:9px 14px;font-size:12px;box-shadow:0 10px 30px rgb(0 0 0 / .4)}
</style>
</head>

const state = { selected: "c1", tab: "ACTIVE", sub: "ALL", search: "", tenant: null, side: "client", mode: "reply", menu: null, qr: null, qrIndex: 0, suggested: null, pending: 0 };
const cur = () => C.find((c) => c.id === state.selected) ?? null;
const isTeam = (c) => c.status !== "RESOLVED" && !c.auto;
function counts() {
  const team = C.filter(isTeam);
  const calling = team.filter((c) => c.calling && !c.calling.quiet);
  return {
    open: team.filter((c) => c.status === "OPEN").length,
    pending: team.filter((c) => c.status === "PENDING").length,
    calling: calling.length,
    callingSince: Math.max(0, ...calling.map((c) => c.calling.mins)),
    quiet: team.filter((c) => c.calling?.quiet).length,
    unread: C.filter((c) => c.status !== "RESOLVED").reduce((sum, c) => sum + c.unread, 0),
  };
}
function listed() {
  const term = state.search.trim().toLowerCase();
  return C.filter((c) => {
    if (state.tenant && c.tenant !== state.tenant) return false;
    if (term && !c.name.toLowerCase().includes(term)) return false;
    if (state.tab === "RESOLVED") return c.status === "RESOLVED";
    if (state.tab === "AUTO") return c.status !== "RESOLVED" && c.auto;
    return isTeam(c) && (state.sub === "ALL" || c.status === state.sub);
  }).sort((a, b) => (b.calling?.mins ?? -1) - (a.calling?.mins ?? -1) || a.mins - b.mins);
}

function timelineHtml(c) {
  const html = [];
  let day = null;
  const same = (a, b) => a && b && a.d === b.d && a.t === b.t && (a.t === "in" || (a.t === "out" && a.by === b.by && Boolean(a.ai) === Boolean(b.ai)));
  c.messages.forEach((m, index) => {

      html.push(`<div class="day">${m.d === 0 ? "Hoje" : m.d === 1 ? "Ontem" : esc(m.dayLabel)}</div>`);

    html.push(messageHtml(c, m, same(c.messages[index - 1], m), same(m, c.messages[index + 1]), index));
  });
  return html.join("");
}

/** Abre (ou cria) a conversa com o cliente no WhatsApp do restaurante. */
function openChat(name, tenant, source) {
  let chat = C.find((x) => x.name === name && x.channel === "WHATSAPP" && x.status !== "RESOLVED");
  if (!chat) {
    chat = {
      id: `w${C.length}`, name, channel: "WHATSAPP", tenant, status: "OPEN", unread: 0, mins: 0, lastDir: "SYS",
      preview: "Conversa aberta pela equipe", opened: "agora", assigned: ME,
      contact: source?.contact && { ...source.contact, channels: [...source.contact.channels, ["WHATSAPP", `WhatsApp ${source.contact.phone}`]] },
      messages: [{ t: "sys", d: 0, text: `Conversa aberta pela equipe no WhatsApp · Qua, ${clockAt(nowMin)}` }],
    };
    C.unshift(chat);
  }
  Object.assign(state, { tab: "ACTIVE", sub: "ALL", tenant: null, search: "", side: "client" });
  select(chat.id);
  $("#ta")?.focus();
}
const canReceive = (x) => ["WHATSAPP", "INSTAGRAM"].includes(x.channel) && !x.teamOnly;
function fwdRows() {
  const f = state.fwd;
  const term = f.q.trim().toLowerCase();
  const list = C.filter((x) => x.id !== f.from && x.status !== "RESOLVED" && (!term || x.name.toLowerCase().includes(term))).sort((a, b) => canReceive(b) - canReceive(a) || a.mins - b.mins);
  if (!list.length) return '<p class="empty">Nenhuma conversa encontrada.</p>';
  return list.map((x) => {
    const ok = canReceive(x);
    const why = x.teamOnly ? "O cliente não está nesta conversa" : `O ${CH[x.channel].label} não recebe mensagens pelo Dish Desk`;
    return `<button class="fwd-row" data-action="fwd-pick" data-id="${x.id}" aria-pressed="${f.target === x.id}" ${ok ? "" : "disabled"}>
      <img class="logo" src="${CH[x.channel].logo}" alt="${CH[x.channel].label}">
      <span style="min-width:0"><b>${esc(x.name)}${x.tags?.includes("Entregador") ? " · entregador" : ""}</b><small>${ok ? esc(x.tenant) : why}</small></span>
      ${f.target === x.id ? `<span class="check">${ic("check", 16)}</span>` : ""}
    </button>`;
  }).join("");
}
function renderForward() {
  const f = state.fwd;
  const el = $("#fwd");
  if (!f) {
    el.hidden = true;
    el.innerHTML = "";
    return;
  }
  const m = C.find((x) => x.id === f.from).messages[f.index];
  el.hidden = false;
  el.innerHTML = `<div class="backdrop" data-action="fwd-close"></div>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="fwd-title">
      <header><div><h2 class="heading" id="fwd-title">Encaminhar mensagem</h2><p>A conversa escolhida recebe a mensagem, com a marca “Encaminhada”.</p></div><button class="btn ghost xs x" data-action="fwd-close" aria-label="Fechar">${ic("x", 14)}</button></header>
      <div class="fwd-preview">${ic(m.loc ? "map-pin" : m.photo ? "image" : "message-square", 14)}<span>${esc(m.loc ?? (m.photo ? `Foto${m.text ? `: ${m.text}` : ""}` : m.text))}</span></div>
      <div class="search"><label>${ic("search", 14)}<input id="fwd-search" value="${esc(f.q)}" placeholder="Buscar conversa" aria-label="Buscar conversa"></label></div>
      <div class="fwd-list" id="fwd-list">${fwdRows()}</div>
      <footer><button class="btn outline sm" data-action="fwd-close">Cancelar</button><button class="btn accent sm" id="fwd-send" data-action="fwd-send" ${f.target ? "" : "disabled"}>${ic("forward", 14)}Encaminhar</button></footer>
    </div>`;
  $("#fwd-search").focus();
}
function forward(button) {
  const f = state.fwd;
  button.disabled = true;
  button.textContent = "Carregando…";
  setTimeout(() => {
    const m = C.find((x) => x.id === f.from).messages[f.index];
    const target = C.find((x) => x.id === f.target);
    target.messages.push({ t: "out", d: 0, h: clockAt(nowMin), by: ME.split(" ")[0], st: "✓", text: m.text, loc: m.loc, photo: m.photo, fwd: true });
    // Como uma resposta: o chamado para e a conversa fica com quem encaminhou.
    Object.assign(target, { preview: describe(m), lastDir: "OUT", mins: 0, calling: null, auto: false });
    target.assigned ??= ME;
    state.fwd = null;
    renderForward();
    renderList();
    toast(`Encaminhada para ${target.name}.`, { id: target.id, label: "Abrir conversa" });
  }, 700);
}

/* Campo de resposta */
function syncComposer() {
  const ta = $("#ta");
  if (!ta) return;
  ta.style.height = "auto";
  ta.style.height = `${Math.min(ta.scrollHeight + 2, 180)}px`;
  const text = ta.value;
  $("#btn-send").disabled = !text.trim();
  const suggested = state.suggested !== null && text === state.suggested;
  $("#ai-line").hidden = !suggested;
  ta.classList.toggle("ai", suggested);
  const suggest = $("#btn-suggest");
  if (suggest) suggest.disabled = text.trim() !== "";
  // Respostas rápidas: "/" no começo ou o botão.
  const slash = /^\/\S*$/.test(text) ? text.slice(1).toLowerCase() : null;
  const options = slash !== null ? QUICK.filter((q) => q.s.startsWith(slash)) : state.qr === "button" ? QUICK : [];
  const list = $("#qr");
  list.hidden = options.length === 0;
  state.qrOptions = options;
  state.qrIndex = Math.min(state.qrIndex, Math.max(0, options.length - 1));
  list.innerHTML = options.length
    ? `<li class="qr-title">Respostas rápidas</li>${options.map((q, index) => `<li role="option" aria-selected="${index === state.qrIndex}"><button class="${index === state.qrIndex ? "hl" : ""}" data-action="qr-pick" data-index="${index}"><b>/${q.s}</b><span>${esc(q.t)}</span></button></li>`).join("")}`
    : "";
}
function pickQuick(index) {
  const ta = $("#ta");
  const option = state.qrOptions?.[index];
  if (!ta || !option) return;
  ta.value = option.t;
  state.qr = null;
  state.qrIndex = 0;
  syncComposer();
  ta.focus();
}
function send() {
  const ta = $("#ta");
  const c = cur();
  const text = ta?.value.trim();
  if (!c || !text) return;
  const note = c.teamOnly || state.mode === "note";
  nowMin += 1;
  if (note) c.messages.push({ t: "note", d: 0, h: clockAt(nowMin), by: ME.split(" ")[0], text });
  else {
    c.messages.push({ t: "out", d: 0, h: clockAt(nowMin), by: ME.split(" ")[0], st: "✓", text });
    Object.assign(c, { preview: text, lastDir: "OUT", mins: 0, calling: null, auto: false });
    c.assigned ??= ME;
  }
  ta.value = "";
  state.suggested = null;
  state.qr = null;
  syncComposer();
  renderList();
  $("#conv-head").innerHTML = headHtml(c);
  refreshTimeline(true);
  ta.focus();
  if (!note && !c.replied && c.status !== "RESOLVED") {
    c.replied = true;
    setTimeout(() => incoming(c, "Tudo bem, obrigada pelo retorno! 🙏"), 2600);
  }
}
/** Mensagem do cliente chegando (simulada). */
function incoming(c, text) {
  nowMin += 1;
  c.messages.push({ t: "in", d: 0, h: clockAt(nowMin), text });
  Object.assign(c, { preview: text, lastDir: "IN", mins: 0 });
  if (cur() === c) refreshTimeline(false);
  else c.unread += 1;
  renderList();
}

document.addEventListener("click", (event) => {
  const target = event.target.closest("[data-action]");
  if (!target) return closeMenu();
  const { action } = target.dataset;
  const c = cur();
  if (action !== "menu" && state.menu && !["tenant", "assign", "status"].includes(action)) closeMenu();
  switch (action) {
    case "theme": return setTheme(target.dataset.theme);
    case "changes": return toggleChanges();
    case "change": return goChange(Number(target.dataset.n));
    case "home": return select(null);
    case "select": return select(target.dataset.id);
    case "tab": state.tab = target.dataset.tab; state.menu = null; return renderList();
    case "sub": state.sub = target.dataset.sub; return renderList();
    case "stat": state.tab = "ACTIVE"; state.sub = target.dataset.sub; return renderList();
    case "jump-calling": {
      const calling = C.filter((item) => isTeam(item) && item.calling && !item.calling.quiet).sort((a, b) => b.calling.mins - a.calling.mins)[0];
      if (!calling) return;
      state.tab = "ACTIVE"; state.sub = "ALL"; state.tenant = null; state.search = "";
      return select(calling.id);
    }
    case "menu": {
      state.menu = state.menu === target.dataset.menu ? null : target.dataset.menu;
      renderList();
      if (c) $("#conv-head").innerHTML = headHtml(c);
      return;
    }
    case "tenant": state.tenant = target.dataset.tenant || null; state.menu = null; return renderList();
    case "assign": c.assigned = target.dataset.name || null; state.menu = null; renderList(); $("#conv-head").innerHTML = headHtml(c); return;
    case "status": {
      c.status = target.dataset.status;
      state.menu = null;
      if (c.status === "OPEN" && state.tab === "RESOLVED") { state.tab = "ACTIVE"; state.sub = "ALL"; c.auto = false; }
      renderList();
      $("#conv-head").innerHTML = headHtml(c);
      return;
    }
    case "resolve": {
      const order = listed().map((item) => item.id);
      const index = order.indexOf(c.id);
      const next = index === -1 ? order[0] : (order[index + 1] ?? order[index - 1]);
      Object.assign(c, { status: "RESOLVED", calling: null, unread: 0 });
      toast("Conversa resolvida. Abrimos a seguinte da lista.");
      return select(next ?? null);
    }
    case "side": state.side = target.dataset.side; return renderSide();
    case "mode": state.mode = target.dataset.mode; state.suggested = null; state.qr = null; $("#composer").innerHTML = composerHtml(c); $("#ta")?.focus(); return;
    case "qr-open": state.qr = state.qr === "button" ? null : "button"; state.qrIndex = 0; syncComposer(); $("#ta").focus(); return;
    case "qr-pick": return pickQuick(Number(target.dataset.index));
    case "suggest": {
      const ta = $("#ta");
      ta.disabled = true;
      ta.placeholder = "A IA está escrevendo uma sugestão…";
      target.disabled = true;
      target.innerHTML = `${ic("sparkles", 14)}Carregando…`;
      return setTimeout(() => {
        if (cur() !== c || !$("#ta")) return;
        $("#composer").innerHTML = composerHtml(c);
        state.suggested = c.suggestion ?? `Oi, ${c.name.split(" ")[0]}! Aqui é a Ana, da equipe do ${c.tenant}. Já estou vendo isso para você e volto em instantes.`;
        $("#ta").value = state.suggested;
        syncComposer();
        $("#ta").focus();
      }, 900);
    }
    case "discard": $("#ta").value = ""; state.suggested = null; syncComposer(); $("#ta").focus(); return;
    case "send": return send();
    case "to-bottom": return toBottom();
    case "chat": {
      const source = target.dataset.id ? C.find((x) => x.id === target.dataset.id) : null;
      target.disabled = true;
      target.textContent = "Carregando…";
      return setTimeout(() => openChat(target.dataset.name ?? source.name, target.dataset.tenant ?? source.tenant, source), 500);
    }
    case "forward": state.fwd = { from: c.id, index: Number(target.dataset.index), target: null, q: "" }; return renderForward();
    case "fwd-close": state.fwd = null; return renderForward();
    case "fwd-pick": state.fwd.target = target.dataset.id; $("#fwd-list").innerHTML = fwdRows(); $("#fwd-send").disabled = false; return;
    case "fwd-send": return forward(target);
    case "copy": navigator.clipboard?.writeText(target.dataset.text).catch(() => {}); return toast("Copiado: " + target.dataset.text);
    case "same": return toast("Fora do protótipo: este botão continua como é hoje.");
  }
});
document.addEventListener("input", (event) => {
  if (event.target.id === "search") {
    state.search = event.target.value;
    $("#rows").innerHTML = rowsHtml();
  }
  if (event.target.id === "fwd-search") {
    state.fwd.q = event.target.value;
    $("#fwd-list").innerHTML = fwdRows();
  }
  if (event.target.id === "ta") {
    state.qrIndex = 0;
    if (!event.target.value.startsWith("/")) state.qr = state.qr === "button" && event.target.value === "" ? "button" : null;
    syncComposer();
  }
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    if (state.fwd) {
      state.fwd = null;
      return renderForward();
    }
    if (state.menu) return closeMenu();
    if (!$("#changes").hidden) return toggleChanges();
  }
  if (event.target.id !== "ta") return;
  const options = state.qrOptions ?? [];
  if (options.length) {
    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
      event.preventDefault();
      state.qrIndex = (state.qrIndex + (event.key === "ArrowDown" ? 1 : -1) + options.length) % options.length;
      return syncComposer();
    }
    if (event.key === "Enter" || event.key === "Tab") {
      event.preventDefault();
      return pickQuick(state.qrIndex);
    }
    if (event.key === "Escape") {
      event.target.value = "";
      state.qr = null;
      return syncComposer();
    }
  }
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    send();
  }
});
document.addEventListener("scroll", (event) => {
  if (event.target.id !== "timeline") return;
  const el = event.target;
  if (el.scrollHeight - el.scrollTop - el.clientHeight < 40 && state.pending) toBottom();
}, true);

/* ═════════ tema ═════════ */
function setTheme(theme) {
  document.documentElement.classList.toggle("dark", theme === "dark");
  for (const button of document.querySelectorAll("[data-theme]")) button.setAttribute("aria-pressed", String(button.dataset.theme === theme));
}

/* ═════════ "O que mudou" ═════════ */
const show = (id, extra = {}) => {
  Object.assign(state, { tab: "ACTIVE", sub: "ALL", tenant: null, search: "", side: "client", ...extra });
  select(id);
};
const CHANGES = [
  { title: "Filtros que cabem na coluna", text: "Hoje os 5 filtros não cabem e “Resolvidos” fica escondido atrás de uma barra de rolagem. Agora são 3 abas e, dentro de Ativos, os botões Todos, Abertos e Pendentes, com a contagem de cada um. As barras de rolagem das colunas ficam finas.", where: "Lista de conversas", go: () => show("c1"), mark: "#tabs, #subs" },
  { title: "Linha da conversa com mais contexto", text: "Restaurante e número do pedido juntos, uma seta quando a última mensagem foi nossa, e o tempo em âmbar com relógio quando o cliente já foi lido mas está sem resposta há 10 min ou mais (hoje essa conversa fica igual às outras).", where: "Lista de conversas", go: () => show("c1"), mark: '.row[data-id="c2"], .row[data-id="c6"]' },
  { title: "Aviso de chamado leva à conversa", text: "A faixa vermelha “1 conversa chamando um atendente” passa a ser um botão: um clique abre a conversa que espera há mais tempo.", where: "Lista de conversas", go: () => { C[0].calling ??= { mins: 4 }; if (C[0].status === "RESOLVED") C[0].status = "OPEN"; show("c2"); }, mark: ".alarm.urgent" },
  { title: "Resolvidos legíveis", text: "Na aba Resolvidos as linhas deixam de ficar apagadas e não repetem o selo “Resolvida” em todas: a aba já diz isso.", where: "Lista de conversas", go: () => show("c1", { tab: "RESOLVED" }), mark: "#rows" },
  { title: "Filtro de restaurante com o nome à vista", text: "No lugar do ícone sozinho, o botão mostra qual restaurante está filtrado. Só aparece para quem atende mais de um restaurante.", where: "Lista de conversas", go: () => show("c1"), mark: ".tenant-btn" },
  { title: "Cabeçalho: status e responsável visíveis", text: "O selo Aberta, Pendente ou Resolvida fica ao lado do nome, e o botão “Atribuir” passa a mostrar quem é o responsável. Canal, pedido, restaurante e tempo ficam numa linha só.", where: "Conversa", go: () => show("c4"), mark: "#conv-head" },
  { title: "Conversa em coluna de leitura", text: "Em telas largas as mensagens ficavam espalhadas, o cliente num canto e a resposta no outro. Agora a conversa tem largura máxima e fica centralizada.", where: "Conversa", go: () => show("c1"), mark: "#tl-inner" },
  { title: "Separador de dia e mensagens agrupadas", text: "A conversa mostra “Ontem” e “Hoje” entre os dias. Mensagens seguidas da mesma pessoa ficam juntas, com a foto só na última.", where: "Conversa", go: () => { show("c1"); timeline().scrollTop = 0; }, mark: ".day, .msg.stack, .msg.cont" },
  { title: "Novas mensagens sem perder o lugar", text: "Hoje, se você está lendo o começo da conversa e chega mensagem, a tela pula para o fim. Agora ela fica onde está e aparece o botão “nova mensagem”.", where: "Conversa", go: () => { show("c1"); timeline().scrollTop = 0; setTimeout(() => incoming(cur(), "Alguém pode me responder?"), 700); }, mark: "#newmsg", delay: 900 },
  { title: "Campo de resposta", text: "O campo cresce conforme o texto (até 8 linhas), ganha o botão “Respostas rápidas” (o mesmo que digitar /) e a dica do Enter. Sugerir com IA, nota interna e a espera entre mensagens continuam iguais.", where: "Conversa", go: () => show("c1"), mark: "#composer" },
  { title: "Encaminhar mensagem", text: "Passe o mouse numa mensagem (texto, foto ou localização) e clique na seta ao lado para mandá-la a outra conversa: a localização que a cliente mandou vai direto para o entregador, por exemplo. Conversas do iFood e do Cardápio Web aparecem desligadas, porque não recebem mensagens pelo Dish Desk.", where: "Conversa", go: () => show("c1"), mark: ".msg.media" },
  { title: "Pedido informado pelo entregador", text: "Quando o entregador digita o número de um pedido que existe, o card do pedido aparece na conversa dele, com o botão para conversar com o cliente pelo WhatsApp. Já existia no “Problema com um pedido”; agora vale também no “Cheguei” e no “Deixei na portaria” quando a equipe precisa avisar o cliente. Essa parte já está pronta no sistema, sem commit.", where: "Conversa", go: () => show("c3"), mark: ".ocard-cust" },
  { title: "Uma coluna só à direita, com abas", text: "A faixa vertical de pedidos e a terceira coluna somem. O painel da direita ganha as abas Cliente e Pedidos; os atrasados aparecem na própria aba, e os números de cada etapa ficam no topo da lista. Em tela de notebook a conversa não é mais espremida.", where: "Painel da direita", go: () => show("c1", { side: "orders" }), mark: "#side" },
  { title: "Painel do cliente", text: "Botão de copiar no endereço, “1 pedido” no singular e o total gasto em reais (R$ 612) no lugar de “612 reais gastos”.", where: "Painel da direita", go: () => show("c1"), mark: "#cp-contact, #cp-history" },
  { title: "Conversar no WhatsApp pelo painel do cliente", text: "No lugar de copiar o telefone, o botão WhatsApp abre (ou cria) a conversa com o cliente no WhatsApp do restaurante, aqui na Inbox. Aparece quando a conversa aberta é de outro canal, como o iFood, e o cadastro tem telefone.", where: "Painel da direita", go: () => show("c2"), mark: ".wa" },
  { title: "Início da Inbox", text: "Sem conversa aberta, a tela começa pelo que precisa de atenção (com a equipe, chamando atendente, não lidas) e usa a largura. As integrações vêm antes do Atendimento com IA, para a equipe ver logo se alguma está falhando, e ficam em duas colunas; a IA de cada restaurante cabe em uma linha.", where: "Início", go: () => { Object.assign(state, { tab: "ACTIVE", sub: "ALL" }); select(null); }, mark: ".home-inner" },
];
function renderChanges(active) {
  $("#changes").innerHTML = `
    <header><div><b>O que mudou</b><p>Clique em um item para ver na tela.</p></div><button data-action="changes" aria-label="Fechar">${ic("x", 14)}</button></header>
    <ol>${CHANGES.map((change, index) => `<li><button class="${active === index ? "on" : ""}" data-action="change" data-n="${index}"><i>${index + 1}</i><div><b>${change.title}</b><span>${change.text}</span><em>${change.where}</em></div></button></li>`).join("")}</ol>
    <footer>O que não está na lista continua como hoje: alarme sonoro, alerta de fraude, templates, espera entre mensagens, widget do iFood e os dados de cada tela.</footer>`;
}
function toggleChanges() {
  const panel = $("#changes");
  panel.hidden = !panel.hidden;
  $("#btn-changes").setAttribute("aria-pressed", String(!panel.hidden));
  if (!panel.hidden) renderChanges(null);
  else document.querySelectorAll(".mark-on").forEach((el) => el.classList.remove("mark-on"));
}
let markTimer;
function goChange(index) {
  const change = CHANGES[index];
  change.go();
  const panel = $("#changes");
  const scroll = $("ol", panel).scrollTop;
  panel.className = `changes ${change.where === "Painel da direita" ? "left" : "right"}`;
  renderChanges(index);
  $("ol", panel).scrollTop = scroll;
  clearTimeout(markTimer);
  markTimer = setTimeout(() => {
    document.querySelectorAll(".mark-on").forEach((el) => el.classList.remove("mark-on"));
    const targets = [...document.querySelectorAll(change.mark)].filter((el) => !el.hidden);
    targets.forEach((el) => el.classList.add("mark-on"));
    targets[0]?.scrollIntoView({ block: "nearest" });
  }, change.delay ?? 60);
}

/* ═════════ início ═════════ */
$("#btn-changes b").textContent = CHANGES.length;
setTheme(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
renderRail();
select(state.selected);
// As fontes mudam a altura das mensagens depois do primeiro desenho.
document.fonts?.ready.then(toBottom);
addEventListener("load", toBottom);
</script>
