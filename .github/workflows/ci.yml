name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Valores só de CI (nada de produção aqui).
    env:
      DATABASE_URL: postgresql://comanda_app:comanda_app@localhost:5434/comanda
      DATABASE_ADMIN_URL: postgresql://comanda:comanda@localhost:5434/comanda
      REDIS_URL: redis://localhost:6381
      JWT_SECRET: ci-jwt-secret-com-pelo-menos-32-caracteres
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      META_APP_SECRET: ci-meta-app-secret
      META_WEBHOOK_VERIFY_TOKEN: ci-verify-token
      CHANNELS_DRY_RUN: "true"

    steps:
      - uses: actions/checkout@v5

      # Postgres e Redis sobem aqui, e não em `services:`, porque lá um pull que falha derruba o CI (e a Railway pula o
      # deploy): o Docker Hub deu 429 e o ECR público deu 429 e timeout. Tenta cada registro, com novas rodadas.
      - name: Postgres e Redis
        run: |
          pull() {
            for round in 1 2 3; do
              for image in "mirror.gcr.io/library/$1" "public.ecr.aws/docker/library/$1" "docker.io/library/$1"; do
                if timeout 120 docker pull -q "$image"; then docker tag "$image" "$1"; return 0; fi
              done
              sleep $((round * 15))
            done
            echo "::error::Não consegui baixar $1 de nenhum registro."
            return 1
          }
          pull postgres:18-alpine
          pull redis:8-alpine
          docker run -d --name postgres -p 5434:5432 \
            -e POSTGRES_USER=comanda -e POSTGRES_PASSWORD=comanda -e POSTGRES_DB=comanda postgres:18-alpine
          docker run -d --name redis -p 6381:6379 redis:8-alpine
          # -h 127.0.0.1: durante o initdb o Postgres só escuta no socket, então o TCP só responde quando ele está pronto.
          for i in $(seq 60); do
            if docker exec postgres pg_isready -h 127.0.0.1 -U comanda -d comanda && docker exec redis redis-cli ping; then exit 0; fi
            sleep 1
          done
          echo "::error::Postgres ou Redis não ficaram prontos."
          docker logs postgres; docker logs redis
          exit 1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Em produção a infra cria o login da aplicação; aqui, o mesmo script do Docker local.
      - name: Roles do banco
        run: psql "$DATABASE_ADMIN_URL" -f infra/docker/postgres/init/01-app-roles.sql
      - name: Migrations
        run: pnpm --filter @dishdesk/database exec prisma migrate deploy

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Navegador dos E2E
        run: pnpm --filter @dishdesk/web exec playwright install --with-deps chromium
      - run: pnpm e2e

      - name: Artefatos dos E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: apps/web/test-results
