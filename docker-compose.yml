# Infra local de desenvolvimento. Credenciais apenas para uso local.
# Portas do host fora do padrão (5434, 6381) para não conflitar com outros projetos locais.
name: comanda

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: comanda
      POSTGRES_PASSWORD: comanda
      POSTGRES_DB: comanda
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # A partir do Postgres 18 a imagem guarda os dados em /var/lib/postgresql/<versão>/docker
      - postgres-data:/var/lib/postgresql
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comanda -d comanda"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # WhatsApp por QR Code (Evolution API). Usa o banco "evolution" do mesmo Postgres. A chave é a EVOLUTION_API_KEY do .env;
  # o painel da própria Evolution fica em http://localhost:8085/manager. Os webhooks vão para a API de dev no host.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_URL: http://localhost:8085
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-dev-evolution-key}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://comanda:comanda@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: dishdesk
      # Só o necessário: as instâncias e as mensagens novas (o status das enviadas e o download de mídia dependem delas).
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      # Nome do aparelho em "Aparelhos conectados" no celular do restaurante.
      CONFIG_SESSION_PHONE_CLIENT: Dish Desk
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_COLOR: "#1A1814" # ink do design
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8085:8080"

  # LLM local do plano com IA (atendimento, revisão das respostas e avaliação). A API fala com ele pelo formato da OpenAI
  # (AI_BASE_URL=http://localhost:11434/v1). Usa a GPU NVIDIA; o modelo é baixado uma vez: docker compose exec ollama ollama pull gemma4:12b
  ollama:
    image: ollama/ollama:0.40.4
    environment:
      # O modelo nunca sai da GPU (~8 GB de VRAM): carregar de novo leva ~100 s, mais que o AI_TIMEOUT_MS da API.
      OLLAMA_KEEP_ALIVE: "-1"
      # O padrão (4096 tokens) corta o começo do prompt numa conversa longa ou numa página grande do agente da extensão.
      OLLAMA_CONTEXT_LENGTH: "8192"
    gpus: all
    restart: unless-stopped # volta sozinho quando o Docker abre: a produção usa este Ollama (serviço ngrok abaixo)
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  # Túnel da IA para a produção, enquanto só há clientes de teste: a API da Railway chama este Ollama pelo domínio fixo
  # do ngrok (AI_BASE_URL=https://<domínio>/v1). Usa a conta do ngrok instalado no Windows (ngrok.yml) e a política em
  # %LOCALAPPDATA%\ngrok\dishdesk-ia-policy.yml (fora do repositório: tem a chave, a mesma AI_API_KEY da Railway), que
  # só deixa passar o POST de chat com a chave. Sobe à parte: docker compose --profile ia-producao up -d ngrok
  ngrok:
    image: ngrok/ngrok:3.39.12-alpine
    profiles: [ia-producao]
    depends_on: [ollama]
    restart: unless-stopped
    command:
      - http
      - http://ollama:11434
      - --url=https://inenarrable-bev-mechanomorphic.ngrok-free.dev
      - --config=/etc/ngrok/ngrok.yml
      - --traffic-policy-file=/etc/ngrok/dishdesk-ia-policy.yml
      - --log=stdout
    volumes:
      - ${LOCALAPPDATA}/ngrok/ngrok.yml:/etc/ngrok/ngrok.yml:ro
      - ${LOCALAPPDATA}/ngrok/dishdesk-ia-policy.yml:/etc/ngrok/dishdesk-ia-policy.yml:ro

volumes:
  postgres-data:
  redis-data:
  ollama-data:
