<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Dish Desk Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a moldura do app em cima, e embaixo o que mudou naquela tela. Tokens de apps/web/app/globals.css. */
:root {
  --paper:#F7F4EF; --surface:#FFFFFF; --surface-2:#F0EDE8;
  --ink:#1A1814; --ink-2:#4A4540; --ink-3:#7A736B; --on-ink:#F7F4EF;
  --rule:#DDD8D0; --rule-soft:#EAE6DF; --tag-line:#C4B8A0;
  --tomate:#C4341A; --tomate-lt:#FDECEA; --tomate-ink:#9E2912;
  --success:#2D7D46; --success-lt:#EAF6EF; --success-ink:#1D5C33;
  --warning:#B45309; --warning-lt:#FEF9EC; --warning-ink:#7A5008;
  --rail:#1A1814; --rail-line:#2D2A24; --rail-ink:#A8A198;
  --whatsapp:#25D366; --instagram:#E1306C; --ifood:#EA1D2C; --cardapio:#7C3AED;
  --display:'Fraunces',Georgia,serif; --ui:'Inter',system-ui,sans-serif;
  --r-sm:4px; --r:6px; --r-lg:8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper:#161411; --surface:#1F1C18; --surface-2:#2A2621;
  --ink:#F3EFE8; --ink-2:#CBC4BA; --ink-3:#9A9288; --on-ink:#1A1814;
  --rule:#3A352E; --rule-soft:#2E2A24; --tag-line:#5C5344;
  --tomate:#E8664B; --tomate-lt:#3A1E17; --tomate-ink:#F4A08D;
  --success:#62BC81; --success-lt:#1B2E22; --success-ink:#9BDAB0;
  --warning:#E3A350; --warning-lt:#33270F; --warning-ink:#F0C98E;
  --rail:#100E0C; --rail-line:#2A2620; color-scheme:dark;
} }
:root[data-theme="dark"] {
  --paper:#161411; --surface:#1F1C18; --surface-2:#2A2621;
  --ink:#F3EFE8; --ink-2:#CBC4BA; --ink-3:#9A9288; --on-ink:#1A1814;
  --rule:#3A352E; --rule-soft:#2E2A24; --tag-line:#5C5344;
  --tomate:#E8664B; --tomate-lt:#3A1E17; --tomate-ink:#F4A08D;
  --success:#62BC81; --success-lt:#1B2E22; --success-ink:#9BDAB0;
  --warning:#E3A350; --warning-lt:#33270F; --warning-ink:#F0C98E;
  --rail:#100E0C; --rail-line:#2A2620; color-scheme:dark;
}
*,*::before,*::after { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:400 13px/1.5 var(--ui); -webkit-font-smoothing:antialiased; }
h1,h2,h3,p { margin:0; }
button,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
svg { display:block; flex:none; }
.num { font-variant-numeric:tabular-nums; }
.muted { color:var(--ink-3); }
.small { font-size:12px; }

.page { max-width:1440px; margin:0 auto; padding-block:20px 40px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); display:grid; gap:16px; }
.page > * { min-width:0; }
.top { display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; }
.brand { display:flex; align-items:center; gap:10px; margin-right:auto; }
.logo { width:28px; height:28px; border-radius:var(--r); background:var(--tomate); display:grid; place-items:center; }
.brand h1 { font:700 20px/1.2 var(--display); letter-spacing:-.3px; }
.tabs { display:flex; flex-wrap:wrap; gap:4px; }

.btn { height:36px; padding:0 14px; border-radius:var(--r); border:1px solid transparent; background:transparent; font-weight:500; display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; }
.btn.sm { height:30px; padding:0 10px; font-size:12.5px; }
.btn.primary { background:var(--ink); color:var(--on-ink); }
.btn.accent { background:var(--tomate); color:#fff; }
.btn.outline { background:var(--surface); border-color:var(--rule); }
.btn.ghost:hover,.btn.outline:hover { background:var(--surface-2); }
.btn:disabled { opacity:.55; cursor:default; }
.chip { height:28px; padding:0 10px; border-radius:var(--r); border:1px solid var(--rule); background:var(--surface); font-size:12.5px; font-weight:500; color:var(--ink-2); }
.chip[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:var(--on-ink); }
.chips { display:flex; flex-wrap:wrap; gap:4px; }
.link { border:0; background:none; padding:0; font-weight:500; text-decoration:underline; text-underline-offset:2px; font-size:12.5px; }

.app { display:flex; border:1px solid var(--rule); border-radius:var(--r-lg); overflow:hidden; background:var(--surface); }
.rail { width:56px; flex:none; background:var(--rail); border-right:1px solid var(--rail-line); padding:14px 0; display:flex; flex-direction:column; align-items:center; gap:4px; }
.rail .logo { margin-bottom:16px; width:32px; height:32px; }
.rail button { width:36px; height:36px; border:0; border-radius:var(--r); background:none; color:var(--rail-ink); display:grid; place-items:center; }
.rail button[aria-current="page"] { background:#34302A; color:#F7F4EF; }
.rail button:disabled { opacity:.35; cursor:default; }
.screen { flex:1; min-width:0; }

/* Peças que carregam estado na forma */
.dot { width:8px; height:8px; border-radius:50%; flex:none; display:inline-block; }
.ifood { background:var(--ifood); } .wa { background:var(--whatsapp); } .ig { background:var(--instagram); } .cw { background:var(--cardapio); }
.avatar { width:34px; height:34px; border-radius:50%; background:var(--surface-2); color:var(--ink-2); display:grid; place-items:center; font-size:11.5px; font-weight:600; flex:none; }
.tag { display:inline-flex; align-items:center; gap:4px; height:21px; padding:0 7px; border:1px dashed var(--tag-line); border-radius:var(--r-sm); font-size:11.5px; font-weight:500; color:var(--ink-2); white-space:nowrap; }
.badge { display:inline-flex; align-items:center; gap:4px; height:19px; padding:0 7px; border-radius:var(--r-sm); font-size:11px; font-weight:600; white-space:nowrap; }
.badge.open { background:var(--tomate-lt); color:var(--tomate-ink); }
.badge.pend { background:var(--warning-lt); color:var(--warning-ink); }
.badge.done { background:var(--success-lt); color:var(--success-ink); }
.badge.fraud { background:var(--tomate); color:#fff; }
.track { display:flex; gap:3px; }
.track i { height:6px; flex:1; min-width:10px; border-radius:2px; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--rule); }
.track i.on { background:var(--ink); box-shadow:none; }
.track.late i.on { background:var(--tomate); }
.track.done i.on { background:var(--success); }
.track.cancel i { background:repeating-linear-gradient(135deg,var(--rule) 0 3px,transparent 3px 6px); box-shadow:none; }
.recency { height:6px; border-radius:3px; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--rule); overflow:hidden; }
.recency b { display:block; height:100%; background:var(--ink); }
.recency.gone b { background:var(--tomate); }

/* Aviso preso ao item */
.note { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:8px 10px; border-radius:var(--r); font-size:12.5px; }
.note > span { flex:1 1 220px; min-width:0; }
.note > .ic { flex:none; }
.note.danger { background:var(--tomate-lt); color:var(--tomate-ink); }
.note.warn { background:var(--warning-lt); color:var(--warning-ink); }
.note.ok { background:var(--surface-2); color:var(--ink-2); }
.note .ic { align-self:flex-start; margin-top:2px; }
.note-actions { display:flex; flex-wrap:wrap; gap:6px; }

/* Inbox */
.sim { display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin-bottom:10px; }
.sim .label { margin-right:6px; }
.ib-wrap { display:flex; flex-direction:column; min-width:0; }
.band { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:7px 14px; font-size:12.5px; border-bottom:1px solid var(--rule-soft); }
.band > span:first-of-type { flex:1 1 260px; min-width:0; }
.band.danger { background:var(--tomate-lt); color:var(--tomate-ink); }
.band.warn { background:var(--warning-lt); color:var(--warning-ink); }
.band.dark { background:var(--ink); color:var(--on-ink); }
.inbox { display:grid; grid-template-columns:304px minmax(0,1fr) 316px; height:860px; }
.pane { min-height:0; min-width:0; display:flex; flex-direction:column; }
.pane + .pane { border-left:1px solid var(--rule-soft); }
.pane-head { padding:12px 14px; border-bottom:1px solid var(--rule-soft); display:grid; gap:8px; }
.title { font:600 16px/1.3 var(--display); }
.scroll { flex:1; min-height:0; overflow-y:auto; }
.row { display:flex; align-items:center; gap:6px; min-width:0; }
.spread { justify-content:space-between; }
.wrap { flex-wrap:wrap; }
.name { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.clip { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-3); font-size:12.5px; min-width:0; }
.wait { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:500; flex:none; }
.label { font-size:11.5px; font-weight:500; color:var(--ink-3); }
.tags { display:flex; flex-wrap:wrap; gap:4px; }
.lead { font:600 26px/1.1 var(--display); letter-spacing:-.3px; font-variant-numeric:tabular-nums; }
.pairs { display:grid; gap:6px; }
.pair { display:flex; justify-content:space-between; gap:10px; }
.field { width:100%; height:32px; padding:0 9px; border:1px solid var(--rule); border-radius:var(--r); background:var(--surface); color:var(--ink); font:inherit; }
.field:focus,textarea:focus { outline:0; border-color:var(--ink); box-shadow:0 0 0 3px rgba(26,24,20,.08); }
select.field { padding-right:4px; }
textarea { display:block; width:100%; min-height:42px; max-height:180px; resize:vertical; padding:8px 10px; border:1px solid var(--rule); border-radius:var(--r); background:var(--surface); }
.icon-btn { width:30px; height:30px; display:inline-grid; place-items:center; border:1px solid transparent; border-radius:var(--r); background:none; color:var(--ink-2); flex:none; }
.icon-btn:hover { background:var(--surface-2); }
.seg-tabs { display:flex; border-bottom:1px solid var(--rule-soft); }
.seg-tabs button { flex:1; height:36px; border:0; border-bottom:2px solid transparent; background:none; font-weight:500; color:var(--ink-3); display:inline-flex; align-items:center; justify-content:center; gap:5px; }
.seg-tabs button[aria-pressed="true"] { color:var(--ink); border-bottom-color:var(--ink); }
.count { min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:var(--tomate); color:#fff; font-size:10.5px; font-weight:600; display:inline-grid; place-items:center; font-variant-numeric:tabular-nums; }
.alarm { width:100%; display:flex; align-items:center; gap:8px; padding:9px 14px; border:0; background:var(--tomate); color:#fff; text-align:left; font-weight:600; }
.alarm.quiet { background:var(--ink); color:var(--on-ink); font-weight:500; }
.alarm span:nth-child(2) { flex:1; min-width:0; }
.conv { position:relative; width:100%; display:flex; gap:10px; padding:10px 14px; border:0; border-bottom:1px solid var(--rule-soft); border-left:3px solid transparent; background:none; text-align:left; }
.conv:hover { background:var(--paper); }
.conv[aria-current="true"] { background:var(--surface-2); border-left-color:var(--ink); }
.conv.call { background:var(--tomate-lt); border-left-color:var(--tomate); }
.conv.call-quiet { border-left-color:var(--ink); }
.conv.dim { opacity:.62; }
.conv-body { flex:1; min-width:0; display:grid; gap:2px; }
.ch-av { position:relative; flex:none; display:block; width:34px; height:34px; align-self:flex-start; }
.ch-av .mini { position:absolute; right:-3px; bottom:-3px; width:15px; height:15px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:8px; font-weight:700; border:2px solid var(--surface); box-sizing:content-box; margin:-2px; }
.flag { display:inline-flex; align-items:center; gap:4px; height:18px; padding:0 6px; border-radius:var(--r-sm); font-size:10.5px; font-weight:600; width:max-content; max-width:100%; }
.flag.call { background:var(--tomate); color:#fff; }
.flag.quiet { background:var(--ink); color:var(--on-ink); }
.flag.off { background:var(--surface-2); color:var(--ink-2); box-shadow:inset 0 0 0 1px var(--rule); }
.pin { flex:none; max-height:58%; overflow-y:auto; padding:10px 14px 8px; border-bottom:1px solid var(--rule-soft); display:grid; gap:8px; }
.order { border:1px solid var(--rule); border-radius:var(--r-lg); background:var(--surface); overflow:hidden; }
.order.fraud { border-color:var(--tomate); }
.order.low { border-color:var(--warning); }
.order-main { padding:10px 12px; display:grid; gap:8px; }
.order-sec { padding:10px 12px; border-top:1px solid var(--rule-soft); display:grid; gap:8px; }
.alert-head { display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; padding:6px 12px; font-size:12.5px; font-weight:600; background:var(--tomate); color:#fff; }
.alert-head.low { background:var(--warning-lt); color:var(--warning-ink); }
.alert-head .link { color:inherit; font-size:12px; }
.alert-head .sp { margin-left:auto; display:inline-flex; align-items:center; gap:10px; font-weight:400; font-size:11.5px; }
.timebar { position:relative; height:8px; border-radius:4px; background:var(--surface-2); }
.timebar b { position:absolute; inset:0 auto 0 0; border-radius:4px; background:var(--ink); }
.timebar.late b { background:var(--tomate); }
.timebar i { position:absolute; top:-2px; width:3px; height:12px; margin-left:-1px; border-radius:2px; box-shadow:0 0 0 1px var(--surface); }
.legend { display:flex; flex-wrap:wrap; gap:3px 14px; font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.legend span { display:inline-flex; align-items:center; gap:4px; }
.legend i { width:7px; height:7px; border-radius:50%; }
.marks { display:inline-flex; flex-wrap:wrap; gap:3px; }
.marks i { width:10px; height:10px; border-radius:2px; box-shadow:inset 0 0 0 1px var(--tag-line); }
.marks i.on { background:var(--tomate); box-shadow:none; }
.meter { height:6px; border-radius:3px; background:var(--surface-2); overflow:hidden; flex:1; min-width:60px; }
.meter b { display:block; height:100%; background:var(--tomate); }
.tbl { width:100%; border-collapse:collapse; font-size:12px; }
.tbl th { text-align:left; font-weight:500; color:var(--ink-3); padding:3px 8px 3px 0; }
.tbl td { padding:4px 8px 4px 0; border-top:1px solid var(--rule-soft); vertical-align:top; }
.tbl-wrap { overflow-x:auto; }
.messages { flex:1; min-height:0; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:6px; position:relative; }
.day { align-self:center; font-size:11px; color:var(--ink-3); padding:2px 8px; background:var(--surface-2); border-radius:var(--r-sm); margin:4px 0; }
.line { display:flex; align-items:flex-end; gap:6px; max-width:82%; }
.line.out { align-self:flex-end; flex-direction:row-reverse; }
.line .fw { opacity:0; }
.line:hover .fw,.line .fw:focus-visible { opacity:1; }
.msg { min-width:0; padding:7px 10px; overflow-wrap:anywhere; }
.msg small { display:flex; flex-wrap:wrap; gap:4px; font-size:11px; opacity:.72; margin-top:2px; font-variant-numeric:tabular-nums; }
.msg.in { background:var(--surface); border:1px solid var(--rule); border-radius:12px 12px 12px 2px; }
.msg.out { background:var(--ink); color:var(--on-ink); border-radius:12px 12px 2px 12px; }
.msg.fail { box-shadow:0 0 0 2px var(--tomate); }
.center { align-self:center; max-width:88%; padding:6px 10px; border-radius:var(--r); font-size:12px; text-align:center; }
.center.auto { background:var(--warning-lt); color:var(--warning-ink); }
.center.note { background:var(--warning-lt); color:var(--warning-ink); border:1px dashed var(--tag-line); text-align:left; align-self:stretch; max-width:none; }
.center.sys { background:var(--surface-2); color:var(--ink-2); }
.center.block { background:var(--tomate-lt); color:var(--tomate-ink); text-align:left; align-self:stretch; max-width:none; }
.center.eval { align-self:stretch; max-width:none; text-align:left; background:var(--paper); border:1px solid var(--rule); color:var(--ink-2); }
.center strong { display:block; }
.thumb { width:190px; max-width:100%; aspect-ratio:4/3; border:0; padding:0; border-radius:var(--r); background:linear-gradient(135deg,var(--surface-2),var(--rule)); display:grid; place-items:center; color:var(--ink-3); }
.voice { display:flex; align-items:center; gap:8px; width:190px; max-width:100%; }
.voice .meter b { background:currentColor; }
.jump { position:sticky; bottom:0; align-self:center; }
.composer { position:relative; border-top:1px solid var(--rule-soft); padding:8px 14px 10px; display:grid; gap:7px; }
.composer.noting textarea { background:var(--warning-lt); border-style:dashed; border-color:var(--tag-line); }
.mode { display:flex; gap:2px; }
.mode button { height:26px; padding:0 9px; border:0; border-radius:var(--r-sm); background:none; font-size:12.5px; font-weight:500; color:var(--ink-3); }
.mode button[aria-pressed="true"] { background:var(--surface-2); color:var(--ink); }
.pop { position:absolute; left:14px; right:14px; bottom:calc(100% - 4px); max-height:220px; overflow-y:auto; background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-lg); box-shadow:0 8px 24px rgba(26,24,20,.14); z-index:3; }
.pop button { display:block; width:100%; padding:7px 10px; border:0; background:none; text-align:left; }
.pop button[aria-selected="true"],.pop button:hover { background:var(--surface-2); }
.side { padding:14px; display:grid; gap:14px; align-content:start; }
.sec { display:grid; gap:6px; }
.stages { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px; }
.stages div { padding:7px 6px; border-radius:var(--r); background:var(--paper); }
.stages strong { display:block; font:600 18px/1.1 var(--display); font-variant-numeric:tabular-nums; }
.stages span { font-size:11px; color:var(--ink-3); }
.mini-order { width:100%; display:grid; gap:5px; padding:9px 0; border:0; border-bottom:1px solid var(--rule-soft); background:none; text-align:left; }
.home { padding:20px 22px 26px; display:grid; gap:16px; align-content:start; }
.home-hero { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:12px; }
.tiles { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 18px; align-content:center; }
.tiles b { display:block; font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; }
.int-row { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:9px 0; border-top:1px solid var(--rule-soft); }
.int-row:first-of-type { border-top:0; }
.int-row > div { flex:1 1 170px; min-width:0; }
.sys-ic { width:28px; height:28px; border-radius:var(--r); display:grid; place-items:center; color:#fff; font-size:11px; font-weight:700; flex:none; }
.overlay { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px)); background:rgba(26,24,20,.45); overflow-y:auto; }
.dialog { width:min(480px,100%); max-height:100%; overflow-y:auto; padding:18px; border-radius:var(--r-lg); background:var(--surface); display:grid; gap:12px; }
.dialog .foot { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; }
.opt { display:flex; gap:8px; align-items:flex-start; padding:7px 0; }
.toast { position:fixed; left:50%; bottom:max(18px,env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:30; max-width:calc(100% - 32px); padding:8px 14px; border-radius:var(--r); background:var(--ink); color:var(--on-ink); font-weight:500; }
.skel { height:54px; margin:8px 14px; border-radius:var(--r); background:var(--surface-2); }
.center-box { padding:26px 18px; text-align:center; color:var(--ink-3); display:grid; gap:10px; justify-items:center; font-size:12.5px; }

/* Páginas */
.body { padding:22px 24px 26px; display:grid; gap:18px; }
.page-title { font:700 21px/1.2 var(--display); letter-spacing:-.3px; }
.hero { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:12px; }
.card { border:1px solid var(--rule); border-radius:var(--r-lg); padding:16px; min-width:0; }
.card.fill { background:var(--paper); border-color:var(--rule-soft); }
.hero-num { font:700 48px/1 var(--display); letter-spacing:-1px; font-variant-numeric:tabular-nums; }
.hero-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; margin-bottom:14px; }
.subs { display:flex; flex-wrap:wrap; gap:8px 26px; margin-top:14px; padding-top:12px; border-top:1px solid var(--rule-soft); }
.subs b { font-weight:600; font-size:15px; font-variant-numeric:tabular-nums; display:block; }
.now { display:grid; gap:9px; margin-top:10px; }
.list { border:1px solid var(--rule); border-radius:var(--r-lg); overflow:hidden; }
.item { padding:11px 14px; display:grid; gap:8px; }
.item + .item { border-top:1px solid var(--rule-soft); }
.o-row { display:grid; grid-template-columns:62px minmax(120px,1.2fr) minmax(130px,1fr) 104px 86px 124px; gap:12px; align-items:center; }
.c-row { display:grid; grid-template-columns:minmax(170px,1.5fr) minmax(130px,1fr) 60px 96px minmax(120px,1fr); gap:12px; align-items:center; }
.right { text-align:right; justify-self:end; }
.segs { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; }
.seg { display:grid; gap:4px; padding:10px; text-align:left; border:1px solid var(--rule); border-radius:var(--r-lg); background:var(--surface); }
.seg[aria-pressed="true"] { border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }
.seg strong { font:600 20px/1.1 var(--display); font-variant-numeric:tabular-nums; }
.compare { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.compare > div { background:var(--paper); border-radius:var(--r); padding:9px 10px; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
.bar-row { display:grid; grid-template-columns:70px minmax(0,1fr) 40px; gap:10px; align-items:center; padding:5px 0; }
.split { display:flex; height:10px; border-radius:3px; overflow:hidden; gap:2px; margin:10px 0 8px; }
.split i:first-child { background:var(--ink); } .split i:last-child { background:var(--tag-line); }

/* Notas do design */
.changes { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; padding:4px 2px; }
.changes h3 { font:600 16px/1.3 var(--display); margin-bottom:4px; }
.changes p + p { margin-top:4px; }
.changes .was { color:var(--ink-3); }
.sys { padding:22px 24px; display:grid; gap:26px; }
.sys section { display:grid; gap:10px; }
.swatches { display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:8px; }
.swatch i { display:block; height:38px; border-radius:var(--r); border:1px solid var(--rule); margin-bottom:4px; }
.demo { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.rules { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.out-list { margin:0; padding-left:18px; columns:2; max-width:640px; }

@media (max-width:1040px) {
  .inbox { grid-template-columns:260px minmax(0,1fr); grid-template-rows:860px auto; height:auto; }
  .inbox .pane:last-child { grid-column:1 / -1; border-left:0; border-top:1px solid var(--rule); }
  .home-hero { grid-template-columns:minmax(0,1fr); }
  .segs { grid-template-columns:repeat(3,minmax(0,1fr)); }
}
@media (max-width:760px) {
  .rail { display:none; }
  .inbox { grid-template-columns:minmax(0,1fr); grid-template-rows:none; height:auto; }
  .pin { max-height:none; }
  .line { max-width:94%; }
  .inbox .pane + .pane { border-left:0; border-top:1px solid var(--rule); }
  .inbox .pane:first-child .scroll { max-height:208px; }
  .inbox .messages { max-height:340px; }
  .inbox .pane:last-child { grid-column:auto; }
  .body,.sys { padding:16px; }
  .hero,.two,.changes,.rules { grid-template-columns:minmax(0,1fr); }
  .hero-num { font-size:40px; }
  .o-row { grid-template-columns:auto minmax(0,1fr) auto; }
  .o-row .o-track { grid-column:1 / -1; grid-row:2; }
  .o-row .o-origin { display:none; }
  .o-row .o-act { grid-column:1 / -1; justify-self:stretch; }
  .o-row .o-act .btn { width:100%; }
  .c-row { grid-template-columns:minmax(0,1fr) auto; }
  .c-row .c-phone { display:none; }
  .c-row .c-rec { grid-column:1 / -1; }
  .c-row .c-count { display:none; }
  .compare { grid-template-columns:minmax(0,1fr); }
  .out-list { columns:1; }
}

    ${!d ? `<div class="row spread wrap"><span class="small muted">${c.teamOnly ? 'Sem conversa: o cancelamento não envia mensagem ao cliente.' : 'Nada é cancelado sem você confirmar.'}</span><span class="note-actions">${actions}</span></div>` : ''}

}
const cancelRow = ([d, ch, id, v, why, tags]) => `<tr><td class="num">${d}</td><td><span class="row"><span class="dot ${CH_CLASS[ch]}"></span>${CH[ch]}</span></td><td class="num">#${id}</td><td class="num">${v}</td><td>${why} ${tags.map(t => `<span class="tag" style="height:17px;font-size:10.5px">${t}</span>`).join(' ')}</td></tr>`;
function orderBlock(o, c) {
  const state = o.canceled ? 'Cancelado' : STEPS[o.st], open = S.orderOpen[o.id], d = o.dispute, answered = S.disputeDone[o.id];

    ${o.fraud ? fraudSection(o, c) : ''}
    <div class="order-main">
      <div class="row spread"><span class="row"><span class="dot ${CH_CLASS[o.ch]}"></span><strong>${CH[o.ch]} #${o.id}</strong><span class="small muted">· feito às ${o.time}</span></span><strong class="num">${brl(o.val)}</strong></div>
      ${track(o.st, trackClass(o))}
      <div class="row spread small"><strong>${state}</strong><span class="muted">${c.orders <= 1 ? 'Primeiro pedido deste cliente' : `Este cliente tem ${c.orders} pedidos`}</span></div>
      ${!o.canceled && o.el != null ? timeBar(o) : ''}
      <div class="row spread wrap"><button class="link" data-do="orderT" data-id="${o.id}">${open ? 'Ocultar itens' : `Ver ${o.itemsL.length} ${o.itemsL.length === 1 ? 'item' : 'itens'}`}</button>${notifiable ? `<button class="btn sm outline" data-do="modal" data-id="forecast:${o.id}">${o.st === 4 ? 'Avisar saída' : 'Enviar previsão'}</button>` : ''}</div>
      ${open ? itemsList(o) : ''}
    </div>
    ${d && !answered ? `<div class="order-sec" style="background:var(--warning-lt);color:var(--warning-ink)"><div class="row spread wrap"><strong>${d.what}</strong>${arc(d.leftPct, 'var(--tomate)', d.left + ' restantes')}</div><div class="small">“${d.msg}” · ${d.timeout}</div>${S.sim.noActions ? '<div class="small"><strong>Responda no sistema de pedidos da loja.</strong></div>' : `<div class="note-actions"><button class="btn sm outline" data-do="modal" data-id="dispute:${o.id}:no">Recusar</button><button class="btn sm primary" data-do="modal" data-id="dispute:${o.id}:yes">Aceitar</button></div>`}</div>` : ''}
    ${answered ? `<div class="order-sec small">${icon('check', 13)}Enviado ao iFood. O pedido atualiza em instantes…</div>` : ''}

/* ---------- Mensagens ---------- */
const stMark = m => ({ PENDING:'enviando', SENT:'✓', DELIVERED:'✓✓', READ:'✓✓' }[m.st] || '');
function bubble(m, i) {
  const dir = m.dir || m.k, fw = `<button class="icon-btn fw" title="Encaminhar" aria-label="Encaminhar mensagem" data-do="modal" data-id="forward:${i}">${icon('forward', 13)}</button>`;
  let body = esc(m.x || '');
  if (m.k === 'img') body = `<button class="thumb" aria-label="Ampliar imagem" data-do="modal" data-id="image:0">${icon('image', 26)}</button>`;
  if (m.k === 'audio') body = `<span class="voice"><button class="icon-btn" aria-label="Ouvir áudio" data-do="toast" data-id="Reproduzindo o áudio">${icon('play', 13)}</button><span class="meter"><b style="width:35%"></b></span><span class="small num">0:14</span></span>`;
  if (m.k === 'doc') body = `<span class="row">${icon('file')}<span class="name">${esc(m.x)}</span><button class="link" data-do="toast" data-id="Baixando o arquivo">Baixar</button></span>`;
  if (m.k === 'loc') body = `<span class="row">${icon('pin')}<span style="min-width:0">Localização<br><span class="small">${esc(m.x)}</span></span></span><button class="link" data-do="toast" data-id="Abrindo o mapa">Abrir no mapa</button>`;
  if (m.k === 'gone') body = `<span class="muted">${esc(m.x)} não está mais disponível</span>`;
  const foot = dir === 'out' ? [m.h, m.ai ? 'IA' : m.by, m.phone && 'pelo celular', m.rev && 'revisada pela IA', m.fw && 'Encaminhada', stMark(m)].filter(Boolean).join(' · ') : m.h;
  return `<div class="line ${dir === 'out' ? 'out' : ''}"><div class="msg ${dir} ${m.st === 'FAILED' ? 'fail' : ''}">${body}<small>${foot}</small>${m.orig && canAdmin() ? `<small>Antes da revisão: “${esc(m.orig)}”</small>` : ''}${m.st === 'FAILED' ? `<small>não enviada · ${esc(m.err)}</small><button class="btn sm outline" style="color:var(--ink);margin-top:4px" data-do="retry" data-id="${i}" data-load>Tentar novamente</button>` : ''}</div>${m.k !== 'gone' ? fw : ''}</div>`;
}
function message(m, i) {
  if (m.k === 'day') return `<div class="day">${m.x}</div>`;
  if (m.k === 'auto') return `<div class="center auto"><strong>Automação · ${m.n}</strong>${esc(m.x)}<div class="small">${m.h}</div></div>`;
  if (m.k === 'note') return `<div class="center note"><strong>Nota interna · ${m.by}</strong>${esc(m.x)}<div class="small">${m.h} · a equipe vê, o cliente não</div></div>`;
  if (m.k === 'fraud') return `<div class="center sys"><span class="row" style="justify-content:center">${icon('lock', 11)}${m.x} · ${m.h} · Só a equipe vê</span></div>`;
  if (m.k === 'block') return `<div class="center block"><strong>Mensagem não enviada · má conduta no atendimento</strong>“${esc(m.x)}”<div class="small">${m.by}, ${m.h}. A IA não enviou esta resposta ao cliente e ela vai para o gestor do restaurante.</div></div>`;
  if (m.k === 'eval') return canAdmin() && hasAI() ? `<div class="center eval"><div class="row spread wrap"><strong>Avaliação da IA</strong><strong class="num">${m.score}%</strong></div><div class="row wrap small"><span>${m.res ? 'Resolvido' : 'Não resolvido'}</span>·<span>${m.sat === null ? 'Sem reação' : m.sat ? 'Satisfeito' : 'Insatisfeito'}</span>·<span>Assunto: ${m.sub}</span>·<span>Risco de perder o cliente: ${m.risk}%</span>·<span>Atendido por ${m.agent}</span></div></div>` : '';
  return bubble(m, i);
}

/* ---------- Área de resposta ---------- */
function composer(id, c) {
  const note = c.teamOnly || S.mode === 'note', text = S.draft[id] || '';
  const canSend = c.ch !== 'ifood' || !S.sim.noChat, windowOpen = c.ch === 'ig' ? c.win !== 0 : !(S.sim.official && c.ch === 'wa' && c.win === 0);
  const blocked = note ? null : !canSend ? `O iFood não permite responder pelo Dish Desk. Use uma nota interna para registrar o atendimento.` : !windowOpen ? 'A janela de 24h terminou. Para retomar a conversa, envie um template aprovado (botão Template).' : null;
  const down = !note && S.sim.down && c.ch === 'wa', cool = S.cool[id] > 0 && !note;
  const hasIn = c.msgs.some(m => (m.dir || m.k) === 'in'), canAI = hasAI() && !c.tags.includes('Entregador');
  const q = !note && /^\/\S*$/.test(text) ? text.slice(1).toLowerCase() : S.browse ? '' : null;
  const list = q === null ? [] : QUICK.filter(r => r[0].startsWith(q));
  return `<div class="composer ${note ? 'noting' : ''}">
    ${list.length ? `<div class="pop" role="listbox" aria-label="Respostas rápidas">${list.map((r, i) => `<button role="option" aria-selected="${i === S.hi}" data-do="pick" data-id="${r[0]}"><strong>/${r[0]}</strong> <span class="muted">${r[1]}</span></button>`).join('')}</div>` : ''}
    ${down ? `<div class="note danger"><span class="ic">${icon('plug')}</span><span><strong>WhatsApp desconectado.</strong> Esta resposta não vai sair até o canal voltar.</span>${canAdmin() ? '<button class="link" data-do="toast" data-id="Abrindo a reconexão do WhatsApp">Reconectar</button>' : ''}</div>` : ''}
    ${blocked ? `<div class="note warn"><span>${blocked}</span></div>` : ''}
    <div class="row spread wrap"><div class="mode"><button data-do="mode" data-id="reply" aria-pressed="${!note}" ${c.teamOnly ? 'disabled title="Responder fica desligado: o cliente não está na conversa."' : ''}>Responder</button><button data-do="mode" data-id="note" aria-pressed="${note}">Nota interna</button></div>
      <span class="row">${c.ch === 'ig' && !note ? (c.win ? arc(c.winPct, 'var(--warning)', 'Janela de 24h: ' + c.win + ' restantes') : '<span class="small" style="color:var(--tomate)">Janela de 24h encerrada</span>') : ''}${S.suggested === id ? `<span class="small"><strong>Sugestão da IA</strong> · revise antes de enviar</span><button class="link" data-do="discard">Descartar</button>` : ''}</span></div>
    <textarea id="draft" data-draft="${id}" rows="2" aria-label="${note ? 'Nota interna para a equipe' : 'Mensagem para o cliente'}" placeholder="${S.suggesting ? 'A IA está escrevendo uma sugestão…' : note ? 'Escreva uma nota para a equipe (o cliente não vê)' : 'Escreva uma mensagem... / para respostas rápidas'}" ${blocked ? 'disabled' : ''}>${esc(text)}</textarea>
    <div class="row spread wrap"><span class="row wrap">${!note ? `<button class="btn sm ghost" data-do="browse" title="O mesmo que digitar /">Respostas rápidas</button>${canAI ? `<button class="btn sm ghost" data-do="suggest" data-load ${hasIn && !text.trim() && !blocked ? '' : `disabled title="${hasIn ? 'Apague o texto para pedir uma sugestão.' : 'Sem mensagem do cliente para responder. A sugestão aparece quando ele escrever.'}"`}>${icon('spark', 12)}Sugerir com IA</button>` : ''}${S.sim.official && c.ch === 'wa' ? '<button class="btn sm ghost" data-do="modal" data-id="template:0">Template</button>' : ''}` : ''}</span>
      <span class="row"><span class="small muted">Shift + Enter quebra a linha</span><button class="btn sm primary" data-do="send" data-load ${blocked || cool ? 'disabled' : ''}>${cool ? `Aguarde ${S.cool[id]} s` : note ? 'Salvar nota' : 'Enviar'}</button></span></div>
    ${!note ? '<div class="small muted">Para uma performance melhor, digite tudo o que tem a dizer em uma única mensagem.</div>' : ''}
  </div>`;
}
function conversationPane(id, c) {

      ${c.cpf ? `<div class="row spread"><span class="num">${S.cpfOpen === S.conv ? c.cpf.replace(/\*+\./, '123.').replace('-**', '-09') : c.cpf}</span>${S.cpfOpen === S.conv ? '<span class="small muted">Esta visualização foi registrada</span>' : '<button class="link" data-do="cpf" >Ver</button>'}</div>` : ''}</div>

    ${c.addr ? `<div class="sec"><div class="row spread"><span class="label">Endereço de entrega</span><button class="link" data-do="copy" data-id="${esc(c.addr[0])}">Copiar</button></div><div class="small">${c.addr.join('<br>')}</div></div>` : ''}
    ${c.recent.length ? `<div class="sec"><div class="label">Últimos pedidos</div>${c.recent.map(([id, d, v, st]) => `<div class="pair small"><span><span class="num">#${id}</span> <span class="muted">${d}</span></span><span class="num">${v} · ${st}</span></div>`).join('')}</div>` : ''}

    <div>${list.map(o => `<button class="mini-order" data-do="modal" data-id="order:${o.id}"><span class="row spread"><span class="row"><span class="dot ${CH_CLASS[o.ch]}"></span><strong class="num">#${o.id.slice(-4)}</strong><span class="name">${o.who}</span></span><span class="small muted num">${o.time}</span></span>${track(o.st, trackClass(o))}<span class="row spread small"><span>${o.canceled ? 'Cancelado' : STEPS[o.st]}</span><span class="row wrap" style="justify-content:flex-end">${o.late || o.forecastLate ? '<span class="badge open">Atrasado</span>' : ''}${o.dispute && !S.disputeDone[o.id] ? '<span class="badge pend">Cliente pediu cancelamento</span>' : ''}${o.fraud === 'HIGH' && !S.dec[o.id] ? statusBadge('fraud') : ''}</span></span></button>`).join('') || '<div class="center-box">Nenhum pedido em produção.<br>Os pedidos do iFood e do Cardápio Web aparecem aqui assim que chegam.</div>'}</div>
